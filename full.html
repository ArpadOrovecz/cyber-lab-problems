:root{--ink:#1e1e1e;--paper:#fbfaf5;--red:#e03131;--green:#2f9e44;--blue:#1971c2;--orange:#f08c00;--purple:#7048e8;--hand:Hand,"Segoe Print","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;--mono:ui-monospace,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--hand);-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab;display:block;
 background-color:var(--paper);background-image:radial-gradient(#d9d5c7 1.2px,transparent 1.3px);background-size:26px 26px}
#cv.drag{cursor:grabbing}
svg text{font-family:var(--hand)}
.mono{font-family:var(--mono)}
.halo text{paint-order:stroke;stroke:#fbfaf5;stroke-width:7px;stroke-linejoin:round}
.node{cursor:zoom-in}
.node.here{cursor:default}
.badge-zoom{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
.node:hover .glow{opacity:.35}
.glow{opacity:0;transition:opacity .2s}
/* top bar */
#bar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
#bar>*{pointer-events:auto}
.btn{font:700 17px var(--hand);background:#fff;border:2.5px solid var(--ink);border-radius:14px 10px 13px 9px;padding:6px 12px;box-shadow:3px 3px 0 rgba(0,0,0,.18);cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.4;cursor:default}
#crumbs{display:flex;flex-wrap:nowrap;overflow:hidden;gap:2px;align-items:center;font-size:16px;background:rgba(255,255,255,.85);border:2px dashed #b9b4a3;border-radius:12px;padding:4px 10px;min-width:0}
#crumbs a{color:var(--blue);cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#crumbs a.cur{color:var(--ink);font-weight:700;cursor:default}
#crumbs i{color:#999;font-style:normal;padding:0 3px}
#tag{margin-left:auto;font-size:14px;color:#8a8574;background:rgba(255,255,255,.8);padding:3px 8px;border-radius:8px}
/* note card */
#note{position:fixed;right:14px;bottom:14px;width:340px;max-height:calc(100vh - 90px);overflow:auto;background:#fff9c4;border:2.5px solid #d8c84a;border-radius:4px 14px 6px 12px;
 box-shadow:4px 6px 0 rgba(0,0,0,.12);padding:12px 16px 14px;transform:rotate(-.6deg);z-index:4;font-size:18px;line-height:1.35;transition:opacity .25s}
#note h3{margin:0 0 4px;font-size:22px;line-height:1.15;display:flex;gap:8px;align-items:flex-start}
#note .kind{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 7px;color:#fff;display:inline-block;margin-bottom:4px}
#note p{margin:6px 0}
#note pre{font:13.5px/1.4 var(--mono);background:#1e1e1e;color:#f1f1f1;border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
#note .cap{font-size:14px;color:#6b6450;margin:8px 0 2px}
#note .sees{background:#e7f5ff;border-left:4px solid var(--blue);padding:4px 8px;border-radius:4px}
.chat{margin:6px 0;padding:6px 10px;border-radius:12px;font-size:16px;border:2px solid}
.chat b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.chat.me{background:#f3f0ff;border-color:#b197fc;margin-left:24px}
.chat.grok{background:#ebfbee;border-color:#8ce99a;margin-right:24px}
#note .src{font-size:12.5px;color:#7a7360}
#note .soon{background:#fff;border:2px dashed var(--orange);padding:6px 10px;border-radius:10px;color:#a35c00}
#note .tog{display:none}
.term{border-bottom:2.5px dotted var(--blue);cursor:help;color:#0b4f8a}
#tip{position:fixed;z-index:9;max-width:280px;background:#fff;border:2.5px solid var(--blue);border-radius:10px 14px 9px 13px;padding:8px 11px;font-size:16px;line-height:1.3;box-shadow:3px 4px 0 rgba(25,113,194,.25);display:none}
#tip b{color:var(--blue)}
/* hint */
#hint{position:fixed;left:50%;top:64px;transform:translateX(-50%) rotate(-1deg);background:#fff;border:2.5px solid var(--ink);border-radius:14px 10px 16px 9px;padding:8px 14px;font-size:18px;z-index:6;box-shadow:4px 4px 0 rgba(0,0,0,.15);text-align:center;transition:opacity .5s;max-width:92vw}
#hint.gone{opacity:0;pointer-events:none}
#hint kbd{font:13px var(--mono);border:1.5px solid #888;border-radius:4px;padding:0 4px}
@media (max-width:720px){
 .btn{font-size:15px;padding:5px 9px}
 #crumbs{font-size:14px}#crumbs a{max-width:110px}
 #tag{display:none}
 #note{left:8px;right:8px;bottom:8px;width:auto;max-height:52vh;transform:none;font-size:16px;padding:10px 12px}
 #note h3{font-size:19px}
 #note.min .more{display:none}
 #note.min .body>p:first-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 #note .tog{display:inline-block;margin-left:auto;font:700 13px var(--hand);border:2px solid #d8c84a;background:#fff;border-radius:8px;padding:1px 8px;cursor:pointer;white-space:nowrap}
 #hint{font-size:15px;top:auto;bottom:150px}
}
#note .nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}#note .nav .btn{font-size:15px;padding:4px 10px;max-width:49%}

const MW={L:64,P:96};
function mag(L,P){const b={};[['L',L],['P',P]].forEach(([o,c])=>{const w=MW[o],h=w*CF[o][1]/CF[o][0];b[o]=[c[0]-w/2,c[1]-h/2,w]});return b}
function chal(num,id,short,long,def,pos,lblL,note,zones){const n={id,num,short,long,def,title:'Challenge '+num+' · '+short.replace('\n',' '),kind:'story',icon:'badge',...SF,box:mag(pos[0],pos[1]),lblL:lblL||{},note,
 kids:zones.map((z,i)=>Object.assign({kind:['problem','fix','result'][i],...ZF,box:ZB(i)},z,{decor:()=>Z[z.id]()}))};n.decor=chDecor(n);CH.push(n);return n}

 chal(1,'c1','SQL injection','Challenge 1 · Breaking into the login page','SQL injection: typing text into a form that the website then runs as database instructions.',[[548,212],[440,868]],{P:1},
  {text:"This happened on the web server (Ubuntu-3). Its login page asks the {database} to find the user with the typed name and password. That question is written in {SQL|sql}. The weak version glued the visitor's text straight into it. Click a zone to read more."},
  [{id:'p1',title:'The problem',note:{text:"The login page builds a database search out of whatever the visitor types. The attacker typed this text into the username box instead of a name. It rewrites the search so that it matches every user, so the page lets the attacker in without knowing any password.",
     code:[['What the attacker typed (it ends with a space)',PAY]],sees:"The first clue: typing a single ' gave an SQL error message. That showed my typed text was being glued into the search."},
    kids:[DEEP('rewrite','Piece by piece','Each piece changes\nthe search.','problem','rewrite',[17,600,166],{text:"The website glues the typed text between two quotes inside its search. The attacker's text closes that quote early and adds its own instructions. The database cannot tell which part came from the website and which part came from the visitor.",
       code:[['The weak login (real code, shortened)',"$sql = \"SELECT username FROM users WHERE username = '\"\n     . $_POST[\"username\"] . \"' AND password = '\" . $_POST[\"password\"] . \"'\";"]]}),
     DEEP('space','One missing space','It failed until I\nadded one space.','problem','space',[217,600,166],{text:"My first attack crashed the page instead of logging in. I printed the exact search the page built and saw it ended in `--'`. MySQL only treats `--` as “ignore the rest” when a space follows it. With the space, the attack worked.",
       code:[['What MySQL received (crashed)',"... OR '1'='1' LIMIT 1 --'"],['With the space (worked)',"... OR '1'='1' LIMIT 1 -- '"]],ex:[['Grok','The error happens because MySQL only treats -- as a comment when there is a space after it.']]})]},
   {id:'f1',title:'The fix: a prepared statement',note:{text:"The secure version first sends the database the search with an empty slot (a ?) where the username goes. The visitor's text is sent separately. The database only ever uses it as a name to look up, never as part of the search instructions. This is called a {prepared statement}.",
     code:[['The secure login (real code, shortened)','$stmt = $conn->prepare("SELECT password FROM users WHERE username = ?");\n$stmt->bind_param("s", $_POST["username"]);\n$stmt->execute();']]}},
   {id:'r1',title:'The result',note:{text:"The same attack text is now just looked up as a strange username. No user has that name, so the login fails. A real user with the correct password still logs in normally. Challenge 6 shows how teachers can try both versions themselves."}}]),
 chal(2,'c2','Firewall rule','Challenge 2 · Keeping the attacker away from the database','A firewall is a guard between networks that decides, rule by rule, which traffic may pass.',[[355,418],[150,1078]],{L:1},
  {text:"This happened in the {pfSense} {firewall}, which sits between the attacker's network and the servers' network. Same attacker (Kali), same database as in Challenge 1."},
  [{id:'p2',title:'The problem',note:{text:"The database program ({MySQL|mysql}) waits for connections at {port} 3306. I had opened it to the network so the web server could use it. Without a rule, the attacker's machine could connect to that same port directly and skip the website entirely."}},
   {id:'f2',title:'The fix: one precise firewall rule',note:{text:"In pfSense's settings page I added one rule: block traffic from Kali to the database on port 3306. It sits above the general “allow” rule, so it is checked first. The quick block command on the firewall was not good enough: it can only block a whole machine, which would also have cut Kali off from the website it is supposed to attack.",
     ex:[['Grok','The tool that adds a quick block from the shell only blocks the whole source address. It cannot limit the block to TCP port 3306 only.']]},
    kids:[DEEP('test','How I checked it','The database door is shut;\nthe website door is open.','fix','test',[117,600,166],{text:"From Kali I tested both doors. The test to the database's port now times out, which means it is blocked. The test to the website's port (80) is open, so the website still works. The addresses come from the address plan in Challenge 8.",
       code:[['From Kali (2.20 = database, 2.100 = web server)',"nc -zv -w 5 192.168.2.20 3306    # timed out = blocked\nnc -zv -w 5 192.168.2.100 80     # open = website fine"]]})]},
   {id:'r2',title:'The result',note:{text:"Kali can no longer open a connection to the database. The website keeps working, and the web server can still use the database. An attacker can now only reach the database through the website, which is exactly the path Challenge 1 secured.",
     sees:"As an extra limit, the website logs in to the database with an account that can only read the users table. Even a successful attack through the website could not change or delete data."}}]),
 chal(3,'c3','Password\nhashing','Challenge 3 · Storing passwords safely','A hash is a scrambled, one-way version of a password: you can check a password against it, but not turn it back.',[[712,598],[640,1250]],{},
  {text:"This happened in the database (Ubuntu-1), in the table of users. It is about what an attacker would find if they ever got a copy of that table."},
  [{id:'p3',title:'The problem',note:{text:"The users table kept each password in plain text, exactly as typed. Anyone who got a copy of the table, for example through an attack like the one in Challenge 1, could read every password straight away."}},
   {id:'f3',title:'The fix: store a hash',note:{text:"The secure login stores only a {hash} of each password, made with {bcrypt}. When someone logs in, PHP scrambles the typed password the same way and compares the two. One practical snag: a hash is 60 characters long, longer than my password column allowed, so I had to widen the column first.",
     code:[['Checking a login (real code)','if (password_verify($_POST["password"], $row["password"])) {']]}},
   {id:'r3',title:'The result',note:{text:"A copy of the table now only shows scrambled hashes. But hashing is not what stopped the SQL injection: that attack never needs to know a password. Zoom in to see how I found that out."},
    kids:[DEEP('help','Did hashing help?','I wasn\'t sure which change\nstopped the attack.','info','help',[117,440,166],{text:"I added hashing and the prepared statement at the same time, so I wasn't sure which one had stopped the attack. Hashing only changes how passwords are stored. It never touches the search text, so on its own it cannot stop SQL injection.",
       ex:[['Me','so is it hashing tha solved the sql injection or the bindparam?'],['Grok','Hashing did not solve the SQL injection. The prepared statement (with the ? and bind_param) did.']]})]}]),
 chal(4,'c4','The tunnel','Challenge 4 · Letting teachers in without opening a door','A tunnel is a line the server opens from inside to an outside service. Visitors come back in through it.',[[865,296],[620,720]],{},
  {text:"How can a teacher reach a website inside a closed lab? The web server itself opens a {tunnel} out to {Cloudflare|cloudflare}, and visitors are put through on that line. No door into the lab is opened."},
  [{id:'p4',title:'The problem',note:{text:"The lab lives inside {EduCloud|educloud}, which only people with a {VPN} login can reach. Teachers should be able to try the attack from their own laptops. EduCloud gives the lab no public internet address and does not allow forwarding a port to it, so the usual way of publishing a website was not available."}},
   {id:'f4',title:'The fix: a Cloudflare quick tunnel',note:{text:"A small program on the web server (cloudflared) opens an ordinary outgoing connection to Cloudflare, the same kind a browser makes, and keeps it open. Cloudflare gives it a public address. When a teacher opens that address, Cloudflare sends the request down the already-open connection, and the web server answers the same way. Cloudflare only relays; my files never leave the web server.",
     code:[['Starting the tunnel on the web server','cloudflared tunnel --url http://127.0.0.1:80']]},
    kids:[DEEP('call','Why the firewall allows it','To the firewall it looks\nlike a normal reply.','fix','call',[117,640,166],{text:"Firewalls block connections that start outside. They allow connections that start inside, and the replies that come back on them. The tunnel starts inside, so the teachers' requests arrive as replies on a line the server opened itself.",
       ex:[['Me','how can it push back the request to the webserver without the firewall interveneing?'],['Grok','To the firewall it looks like normal reply traffic on a connection Ubuntu-3 itself started. Nothing new is trying to come in from the outside.']]})]},
   {id:'r4',title:'The result',note:{text:"A teacher can open the login page from anywhere, with no VPN. No incoming door was opened in any firewall.",sees:"I restarted the web server to test it: the tunnel came back by itself."},
    kids:[DEEP('service','It keeps running','It starts by itself after\nevery restart.','fix','service',[117,520,166],{text:"At first I started the tunnel by hand, so it stopped as soon as I closed the window or the machine restarted. I turned it into a {systemd} service: Linux now starts it at every boot and restarts it if it crashes.",
       code:[['The key line of the service file','ExecStart=/usr/bin/cloudflared tunnel --url http://127.0.0.1:80\nRestart=on-failure']]})]}]),
 chal(5,'c5','Permanent\nlink','Challenge 5 · One link that never changes','A redirect is a page whose only job is to send the browser on to another address.',[[965,432],[642,410]],{L:1},
  {text:"The tunnel's address changes on every restart, so a page on {GitHub Pages|github pages} {redirects|redirect} visitors to the newest one. A teacher only needs one link."},
  [{id:'p5',title:'The problem',note:{text:"The free quick tunnel gets a new random address every time it starts. A fixed address would need a domain name of my own: free ones now cost money or take days to be approved, so I chose the free path and solved the changing address myself."}},

function setCur(n){cur=n;document.querySelectorAll('.node.here').forEach(e=>e.classList.remove('here'));const g=world.querySelector(`.node[data-id="${n.id}"]`);g&&g.classList.add('here');
 const path=[];for(let p=n;p;p=p.parent)path.unshift(p);
 document.getElementById('crumbs').innerHTML=path.map((p,i)=>`<a data-go="${p.id}" class="${p===n?'cur':''}">${i?esc(p.title):'⌂ Lab'}</a>`).join('<i>›</i>');
 document.getElementById('up').disabled=!n.parent;note(n)}
function rich(t){return esc(t).replace(/`([^`]+)`/g,'<code class="mono">$1</code>').replace(/\{([^}|]+)(?:\|([^}]+))?\}/g,(m,a,k)=>{k=(k||a).toLowerCase();return GL[k]?`<span class="term" data-k="${esc(k)}">${a}</span>`:a})}
function note(n){const N=n.note||{},el=document.getElementById('note');const kinds={problem:['Problem',C.red],fix:['The fix',C.blue],info:['Insight',C.purple],place:['Part of the lab',C.blue],result:['Result',C.green],story:['Challenge',C.blue]};const kd=kinds[n.kind];
 let h=`<span class="kind" style="background:${kd[1]}">${n.kind=='problem'?'✗ ':n.kind=='result'?'✓ ':''}${kd[0]}</span><h3>${esc(n.parent?n.title:'My SQL-injection lab')}<button class="tog">${el.classList.contains('min')?'more ▴':'less ▾'}</button></h3><div class="body">`;
 if(N.text)h+=`<p>${rich(N.text)}</p>`;h+=`<div class="more">`;
 if(n.soon)h+=`<p class="soon">This part is <b>coming in the full version</b>. This version builds Challenges 1 and 2. Press <b>Zoom out</b>.</p>`;
 (N.code||[]).forEach(c=>h+=`<div class="cap">${rich(c[0])}</div><pre>${esc(c[1])}</pre>`);
 if(N.sees)h+=`<p class="sees">${rich(N.sees)}</p>`;
 if(N.ex){h+=`<div class="cap">From my chats with Grok:</div>`;N.ex.forEach(x=>h+=`<div class="chat ${x[0]=='Me'?'me':'grok'}"><b>${x[0]}</b>“${esc(x[1])}”</div>`);h+=`<div class="src">Copied word for word (typos kept).</div>`}
 if(n.kids&&n.parent)h+=`<p class="cap">${n.kind=='story'?'Click a zone (problem, fix, result) to read its full explanation here.':'Click the small drawing inside to zoom deeper.'}</p>`;
 el.innerHTML=h+`</div></div>`+navHTML(n);const hasMore=el.querySelector('.more').textContent.trim();el.querySelector('.tog').style.visibility=hasMore?'':'hidden';el.querySelector('.tog').onclick=e=>{e.stopPropagation();el.classList.toggle('min');note(cur)}}
/* ---------- input ---------- */
const ptr=new Map();let dragged=false,start=null,pinch=null;
function hide(){document.getElementById('hint').classList.add('gone')}
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);cancelAnimationFrame(anim);
 if(ptr.size==1){dragged=false;start=[e.clientX,e.clientY,cam.x,cam.y]}else if(ptr.size==2){const [p,q]=[...ptr.values()];pinch={d:Math.hypot(p[0]-q[0],p[1]-q[1]),k:cam.k,m:[(p[0]+q[0])/2,(p[1]+q[1])/2],cam:Object.assign({},cam)};dragged=true}});
svg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size==2&&pinch){const [p,q]=[...ptr.values()],d=Math.hypot(p[0]-q[0],p[1]-q[1]),m=[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const k=clampK(pinch.k*d/pinch.d),wx=pinch.cam.x+pinch.m[0]/pinch.cam.k,wy=pinch.cam.y+pinch.m[1]/pinch.cam.k;cam={k,x:wx-m[0]/k,y:wy-m[1]/k};apply();hide()}
 else if(ptr.size==1&&start){const dx=e.clientX-start[0],dy=e.clientY-start[1];if(Math.hypot(dx,dy)>6){dragged=true;svg.classList.add('drag');hide()}
  if(dragged){cam.x=start[2]-dx/cam.k;cam.y=start[3]-dy/cam.k;apply()}}});
function end(e){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);svg.classList.remove('drag');
 if(ptr.size==0){if(!dragged&&e.type=='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY),j=t&&t.closest('.jump'),g=t&&t.closest('.node');if(j){hide();fly(BY[j.dataset.go]);ptr.clear();pinch=null;start=null;return}
   if(g){const n=BY[g.dataset.id];if(n!==cur||!isFit(n)){hide();fly(n)}}}else if(dragged)autoCur();pinch=null;start=null}
 else if(ptr.size==1){const p=[...ptr.values()][0];start=[p[0],p[1],cam.x,cam.y];pinch=null}}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
function isFit(n){const c=camFor(n);return Math.abs(Math.log(c.k/cam.k))<.05}
function clampK(k){const r=camFor(TREE).k;return Math.max(r*.5,Math.min(r*400,k))}
let wt=null;svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);hide();const k=clampK(cam.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));
 const wx=cam.x+e.clientX/cam.k,wy=cam.y+e.clientY/cam.k;cam={k,x:wx-e.clientX/k,y:wy-e.clientY/k};apply();clearTimeout(wt);wt=setTimeout(autoCur,180)},{passive:false});
function autoCur(){const F=fitArea(),wx=cam.x+(F.x+F.w/2)/cam.k,wy=cam.y+(F.y+F.h/2)/cam.k;let best=TREE;
 (function walk(n){(n.kids||[]).forEach(k=>{const a=k.A;if(wx>=a.x&&wx<=a.x+a.w&&wy>=a.y&&wy<=a.y+a.h&&a.w*cam.k/F.w>.55){best=k;walk(k)}})})(TREE);if(best!==cur)setCur(best)}
document.getElementById('home').onclick=()=>{hide();fly(TREE)};
document.getElementById('up').onclick=()=>{hide();cur.parent&&fly(cur.parent)};
document.getElementById('crumbs').onclick=e=>{const a=e.target.closest('a[data-go]');if(a&&BY[a.dataset.go]!==cur)fly(BY[a.dataset.go])};
const tip=document.getElementById('tip');let tipOn=null;
function showTip(el){const g=GL[el.dataset.k];tip.innerHTML=`<b>${esc(g[0])}</b> · ${esc(g[1])}`;tip.style.display='block';const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
 let x=Math.min(Math.max(8,r.left),innerWidth-tw-8),y=r.top-th-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px';tipOn=el}
function hideTip(){tip.style.display='none';tipOn=null}
const hov=matchMedia('(hover:hover)').matches;
document.addEventListener('mouseover',e=>{if(!hov)return;const t=e.target.closest&&e.target.closest('.term');if(t)showTip(t);else if(tipOn&&!e.target.closest('#tip'))hideTip()});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.term');if(t){e.stopPropagation();tipOn===t?hideTip():showTip(t)}else if(!e.target.closest('#tip'))hideTip()});
addEventListener('keydown',e=>{if(e.key=='Escape'){if(tipOn)return hideTip();hide();cur.parent&&fly(cur.parent)}});
let rt=null;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const c=cur;VW=innerWidth;VH=innerHeight;build();cam=camFor(c);apply();setCur(c)},120)});
/* ---------- go ---------- */
setTimeout(hide,9000);build();if(VW<=720)document.getElementById('note').classList.add('min');cam=camFor(TREE);apply();setCur(TREE);
const h0=location.hash.slice(1);if(BY[h0]){hide();setCur(BY[h0]);cam=camFor(BY[h0]);apply();setCur(BY[h0])}
</script></body></html>
