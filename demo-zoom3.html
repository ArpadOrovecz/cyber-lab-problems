:root{--ink:#1e1e1e;--paper:#fbfaf5;--red:#e03131;--green:#2f9e44;--blue:#1971c2;--orange:#f08c00;--hand:Hand,"Segoe Print","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;--mono:ui-monospace,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--hand);-webkit-tap-highlight-color:transparent}
#cv,#bar,#notetab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab;display:block;background-color:var(--paper);background-image:radial-gradient(#d9d5c7 1.2px,transparent 1.3px);background-size:26px 26px}
#cv.drag,#cv.drag *{cursor:grabbing!important}
#world{will-change:transform}
svg text{font-family:var(--hand)}
.mono{font-family:var(--mono)}
#cv *{cursor:inherit}
.go:hover>path,.jump:hover>path{filter:drop-shadow(0 0 3px rgba(25,113,194,.45))}
text.term,tspan.term{text-decoration:underline dotted;fill:#1864ab}
#hov{fill:rgba(25,113,194,.07);stroke:#1971c2;stroke-width:4;stroke-linejoin:round}
#sel{fill:none;stroke:#1971c2;stroke-width:3;stroke-dasharray:10 6;opacity:.75}
#hovtip{position:fixed;z-index:7;display:none;pointer-events:none;font:700 14px var(--hand);background:#1971c2;color:#fff;border-radius:8px;padding:2px 8px;white-space:nowrap}
.badge-zoom{transform-box:fill-box;transform-origin:center}
#bar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
#bar>*{pointer-events:auto}
.btn{font:700 17px var(--hand);background:#fff;border:2.5px solid var(--ink);border-radius:14px 10px 13px 9px;padding:6px 12px;box-shadow:3px 3px 0 rgba(0,0,0,.18);cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.btn[disabled]{opacity:.4;cursor:default}
#crumbs{display:flex;flex-wrap:nowrap;overflow:hidden;gap:2px;align-items:center;font-size:16px;background:rgba(255,255,255,.88);border:2px dashed #b9b4a3;border-radius:12px;padding:4px 10px;min-width:0}
#crumbs a{color:var(--blue);cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;flex-shrink:1}
#crumbs a.cur{color:var(--ink);font-weight:700;cursor:default;flex-shrink:0;max-width:none}
#crumbs i{color:#999;font-style:normal;padding:0 3px}
#note{position:fixed;right:14px;bottom:14px;width:340px;max-height:calc(100vh - 90px);overflow:auto;background:#fff9c4;border:2.5px solid #d8c84a;border-radius:4px 14px 6px 12px;box-shadow:4px 6px 0 rgba(0,0,0,.12);padding:10px 16px 14px;transform:rotate(-.6deg);z-index:4;font-size:18px;line-height:1.35}
#note .top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
#note .hide{margin-left:auto;font:700 13px var(--hand);border:2px solid #d8c84a;background:#fff;border-radius:8px;padding:1px 8px;cursor:pointer;white-space:nowrap;color:#6b6450}
#note h3{margin:0 0 4px;font-size:22px;line-height:1.15}
#note .kind{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 7px;color:#fff;display:inline-block}
#note p{margin:6px 0}
#note pre{font:13.5px/1.4 var(--mono);background:#1e1e1e;color:#f1f1f1;border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
#note .cap{font-size:14px;color:#6b6450;margin:8px 0 2px}
#note .sees{background:#e7f5ff;border-left:4px solid var(--blue);padding:4px 8px;border-radius:4px}
.chat{margin:6px 0;padding:6px 10px;border-radius:12px;font-size:16px;border:2px solid}
.chat b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.chat.me{background:#f3f0ff;border-color:#b197fc;margin-left:24px}
.chat.grok{background:#ebfbee;border-color:#8ce99a;margin-right:24px}
#note .src{font-size:12.5px;color:#7a7360}
#note .tog{display:none}
#notetab{position:fixed;right:14px;bottom:14px;z-index:4;display:none;background:#fff9c4;border-color:#d8c84a}
body.nc #note{display:none}body.nc #notetab{display:block}
.term{border-bottom:2.5px dotted var(--blue);cursor:help;color:#0b4f8a}
#tip{position:fixed;z-index:9;max-width:280px;background:#fff;border:2.5px solid var(--blue);border-radius:10px 14px 9px 13px;padding:8px 11px;font-size:16px;line-height:1.3;box-shadow:3px 4px 0 rgba(25,113,194,.25);display:none}
#tip b{color:var(--blue)}



@media (max-width:720px){
 .btn{font-size:15px;padding:5px 9px}
 #home .t,#up .t{display:none}
 #crumbs{font-size:14px;padding:4px 8px}
 #crumbs a.cur{white-space:normal;line-height:1.1;flex-shrink:1;min-width:0}
 #note{left:8px;right:8px;bottom:8px;width:auto;max-height:52vh;transform:none;font-size:16px;padding:8px 12px}
 #note h3{font-size:19px}
 #note.min .more{display:none}
 #note.min .body>p:first-child{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 #note .tog{display:inline-block;font:700 13px var(--hand);border:2px solid #d8c84a;background:#fff;border-radius:8px;padding:1px 8px;cursor:pointer;white-space:nowrap;color:#6b6450}
 #notetab{right:8px;bottom:8px}
 
}

 chal(2,'c2','SQL injection','Challenge 2 · Breaking into the login page','SQL injection: typing text into a form that the website then runs as database instructions.',[[548,212],[440,868]],{P:1},
  {text:"This happened on the web server (Ubuntu-3). Its login page asks the {database} to find the user with the typed name and password. That question is written in {SQL|sql}. The weak version pasted the visitor's text straight into it. Click a zone to read more."},
  [{id:'p1',title:'The problem',note:{text:"The login page builds a database search out of whatever the visitor types. The attacker typed this text into the username box instead of a name. It rewrites the search so that it matches every user, so the page lets the attacker in without knowing any password.",
     code:[['What the attacker typed (it ends with a space)',PAY]],sees:"The first clue: typing a single ' gave an SQL error message. That showed my typed text was being pasted straight into the search."},
    kids:[DEEP('rewrite','Piece by piece','Each piece changes\nthe search.','problem','rewrite',[17,600,166],{text:"The website pastes the typed text between two quotes inside its search. The attacker's text closes that quote early and adds its own instructions. The database cannot tell which part came from the website and which part came from the visitor.",
       code:[['The weak login (real code, shortened)',"$sql = \"SELECT username FROM users WHERE username = '\"\n     . $_POST[\"username\"] . \"' AND password = '\" . $_POST[\"password\"] . \"'\";"]]}),
     DEEP('space','One missing space','It failed until I\nadded one space.','problem','space',[217,600,166],{text:"My first attack crashed the page instead of logging in. I printed the exact search the page built and saw it ended in `--'`. MySQL only treats `--` as “ignore the rest” when a space follows it. With the space, the attack worked.",
       code:[['What MySQL received (crashed)',"... OR '1'='1' LIMIT 1 --'"],['With the space (worked)',"... OR '1'='1' LIMIT 1 -- '"]]})]},
   {id:'f1',title:'The fix: a prepared statement',note:{text:"The secure version first sends the database the search with an empty slot (a ?) where the username goes. The visitor's text is sent separately. The database only ever uses it as a name to look up, never as part of the search instructions. This is called a {prepared statement}.",
     code:[['The secure login (real code, shortened)','$stmt = $conn->prepare("SELECT password FROM users WHERE username = ?");\n$stmt->bind_param("s", $_POST["username"]);\n$stmt->execute();']]}},
   {id:'r1',title:'The result',note:{text:"The same attack text is now just looked up as a strange username. No user has that name, so the login fails. A real user with the correct password still logs in normally. Challenge 7 shows how teachers can try both versions themselves."}}]),
 chal(4,'c4','Firewall rule','Challenge 4 · Keeping the attacker away from the database','A firewall is a program between networks that decides, rule by rule, which traffic may pass.',[[355,418],[150,1078]],{L:1},
  {text:"This happened in the {pfSense} {firewall}, which sits between the attacker's network and the servers' network. Same attacker (Kali), same database as in Challenge 2."},
  [{id:'p2',title:'The problem',note:{text:"The database program ({MySQL|mysql}) waits for connections at {port} 3306. I had opened it to the network so the web server could use it. Without a rule, the attacker's machine could connect to that same port directly and skip the website entirely."}},
   {id:'f2',title:'The fix: one precise firewall rule',note:{text:"In pfSense's settings page I added one rule: block traffic from Kali to the database on port 3306. It sits above the general “allow” rule, so it is checked first. I first tried a quick block typed on the firewall's command line, but it could only shut Kali out completely, not just keep it away from the database's {port}. That would also have cut Kali off from the website it is supposed to attack."},
    kids:[DEEP('test','How I checked it','The database port is blocked;\nthe website port is open.','fix','test',[117,600,166],{text:"From Kali I tested both ports. The test to the database's port now times out, which means it is blocked. The test to the website's port (80) is open, so the website still works. The addresses come from the address plan in Challenge 1.",
       code:[['From Kali (2.20 = database, 2.100 = web server)',"nc -zv -w 5 192.168.2.20 3306    # timed out = blocked\nnc -zv -w 5 192.168.2.100 80     # open = website fine"]]})]},
   {id:'r2',title:'The result',note:{text:"Kali can no longer open a connection to the database. The website keeps working, and the web server can still use the database. An attacker can now only reach the database through the website, which is exactly the path Challenge 2 secured.",
     sees:"As an extra limit, the website logs in to the database with an account that can only read the users table. Even a successful attack through the website could not change or delete data."}}]),
 chal(6,'c6','Password\nhashing','Challenge 6 · Storing passwords safely','A hash is a scrambled, one-way version of a password: you can check a password against it, but not turn it back.',[[712,598],[640,1250]],{},
  {text:"This happened in the database (Ubuntu-1), in the table of users. It is about what an attacker would find if they ever got a copy of that table."},
  [{id:'p3',title:'The problem',note:{text:"The users table kept each password in plain text, exactly as typed. Anyone who got a copy of the table, for example through an attack like the one in Challenge 2, could read every password straight away."}},
   {id:'f3',title:'The fix: store a hash',note:{text:"The secure login stores only a {hash} of each password, made with {bcrypt}. When someone logs in, PHP scrambles the typed password the same way and compares the two. One practical problem: a hash is 60 characters long, longer than my password column allowed, so I had to widen the column first.",
     code:[['Checking a login (real code)','if (password_verify($_POST["password"], $row["password"])) {']]}},
   {id:'r3',title:'The result',note:{text:"A copy of the table now only shows scrambled hashes. But hashing is not what stopped the SQL injection: that attack never needs to know a password. Zoom in to see how I found that out."},
    kids:[DEEP('help','Did hashing help?','I wasn\'t sure which change\nstopped the attack.','info','help',[117,440,166],{text:"I added hashing and the prepared statement at the same time, so I wasn't sure which one had stopped the attack. Hashing only changes how passwords are stored. It never touches the search text, so on its own it cannot stop SQL injection.",

   {id:'f4',title:'The fix: a Cloudflare quick tunnel',note:{text:"A small program on the web server (cloudflared) opens an ordinary outgoing connection to Cloudflare, the same kind a browser makes, and keeps it open. Cloudflare gives it a public address. When a teacher opens that address, Cloudflare sends the request down the already-open connection, and the web server answers the same way. Cloudflare only relays; my files never leave the web server.",
